[package]
name         = "introspect"
version      = "1.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/introspect"
description  = "Persona inspection-plane daemon and CLI."
publish      = false

[lib]
name = "introspect"
path = "src/lib.rs"

[[bin]]
name = "introspect"
path = "src/main.rs"

[[bin]]
name = "meta-introspect"
path = "src/bin/meta_introspect.rs"

[[bin]]
name = "introspect-daemon"
path = "src/bin/introspect_daemon.rs"

[dependencies]
datom-codec            = { git = "https://github.com/LiGoldragon/datom-codec", rev = "627db67f2655efd9f786864009955005fd8ab2ad" }
kameo                  = { git = "https://github.com/LiGoldragon/kameo.git", rev = "f491b45d7dcb55e5837eddde3d5d7ca8ceaa9f01", default-features = false, features = ["macros"] }
meta-signal-introspect = { git = "https://github.com/LiGoldragon/meta-signal-introspect.git", rev = "c13d97362b0677a6aa8b4ffccb587983b1f12645", features = ["datom"] }
protos                 = { git = "https://github.com/LiGoldragon/protos", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3" }
rkyv                   = "0.8"
memory-engine            = { git = "https://github.com/LiGoldragon/memory-engine.git", rev = "abf9d85166e22440440baba03358913458905b8d" }
signal-frame           = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "8aa0bcaeb29fe9e461a11706a469638d2fd109ac", default-features = false }
signal-introspect      = { git = "https://github.com/LiGoldragon/signal-introspect.git", rev = "2d7876d0fe803d069640a5abf543841b7b0a0478", features = ["datom"] }
signal-persona         = { git = "https://github.com/LiGoldragon/signal-persona.git", rev = "48118557368f26b7292f6b0fb2f98df5cec29fc5", features = ["datom"] }
signal-router          = { git = "https://github.com/LiGoldragon/signal-router.git", rev = "03ed6bc2217d6a8d0ed5e1291e417ea4d4de168f", default-features = false }
thiserror              = "2"
tokio                  = { version = "1", features = ["rt-multi-thread"] }
triad-runtime          = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "4cc0a100841d2400f354c008c9faa73b2cedf50e" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = { level = "warn", priority = -1 }

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", rev = "f491b45d7dcb55e5837eddde3d5d7ca8ceaa9f01" }
